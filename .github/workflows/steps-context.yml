name: steps context test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    outputs:
      step_data: ${{ steps.step3.outputs.step_data }}

      step1: ${{ steps.step1.outputs.out }}
      step2: ${{ steps.step2.outputs.out }}

    steps:
      - id: checkout
        uses: actions/checkout@v4

      - id: step1
        run: echo "out=Hello World" >> $GITHUB_OUTPUT
      
      - id: step2
        run: echo "out=Hello World 2" >> $GITHUB_OUTPUT

      - id: step3
        uses: ./actions/set-step-output
        with:
          steps: ${{ toJSON(steps) }}
  
  verify:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: echo "${{ needs.test.outputs.step_data }}"
      - run: echo "${{ needs.test.outputs.step1 }}"
      - run: echo "${{ needs.test.outputs.step2 }}"